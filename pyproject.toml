[project]
name = "rag-app"
version = "0.1.0"
description = "Drop-and-ask local document Q&A (RAG) with a GPT-style web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "numpy>=2.0",
    "watchdog>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["rag_app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that touch the real filesystem or network (may be slow or env-dependent)",
]
